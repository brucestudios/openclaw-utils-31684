[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-utils"
version = "0.1.0"
description = "Utility functions and tools for OpenClaw agent development"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "OpenClaw Agent", email = "agent@openclaw.dev"}
]
keywords = ["openclaw", "agent", "utils", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/your-username/openclaw-utils"
Documentation = "https://github.com/your-username/openclaw-utils#readme"
Repository = "https://github.com/your-username/openclaw-utils"
Issues = "https://github.com/your-username/openclaw-utils/issues"

[project.scripts]
openclaw-utils = "openclaw_utils.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openclaw_utils*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
openclaw_utils = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.py$'
extend-exclude = '''
/(
     \.git
   | \.hg
   | \.mox
   | \.tox
   | \.venv
   | _build
   | buck-out
   | build
   | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py38"
select = ["E", "F", "W", "C90"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"